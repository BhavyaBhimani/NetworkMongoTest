name: End-to-End Automated PR & Fallback Test Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Execute Full Multi-Environment Scenarios
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest requests-mock

      - name: Run Full Multi-Environment Git PR Suite
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/nettrace_db' }}
        run: |
          python scripts/simulate_git_pr_suite.py

      - name: Verify Audit Trail Reconstruction
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/nettrace_db' }}
        run: |
          python -c "
          from app.db.attestations import attestation_ledger
          recon = attestation_ledger.reconstruct_audit_trail('PR-GENESIS-001')
          assert recon['found'] is True, 'Reconstruction failed'
          print('Auditor Reconstruction Successfully Verified:', recon['identity'])
          "
