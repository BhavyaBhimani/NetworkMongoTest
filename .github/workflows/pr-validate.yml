name: PR Policy Verification & Auto-Merge

on:
  pull_request:
    paths:
      - 'environments/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    name: Validate Network Policy & Auto-Merge
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymongo mongomock pydantic pycryptodome python-dotenv

      - name: Seed Database Baseline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/nettrace_db' }}
        run: |
          python seed_data.py

      - name: Run PR Validator Agent (Pre-Action Gate)
        id: validator
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/nettrace_db' }}
          PR_AUTHOR: ${{ github.actor }}
          PR_ID: PR-${{ github.event.pull_request.number }}
        run: |
          python scripts/run_agent_validator.py

      - name: Auto-Merge PR (If Approved & Non-Prod)
        if: steps.validator.outputs.approved == 'true' && steps.validator.outputs.requires_human == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PR approved by Validator Agent without requiring manual sign-off. Initiating auto-merge..."
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash || echo "Auto-merge flag applied."

      - name: Post Human Review Required Notice
        if: steps.validator.outputs.requires_human == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🛡️ **NetTrace AI Notice:** This PR targets a protected environment (\`pat\`/\`prod\`). Mandatory Network Team Lead & Manager approval is required before action can be deployed." || true
